<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Lithuanian Verbs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Загружаем sql.js с официального CDN -->
  <script src="https://sql.js.org/dist/sql-wasm.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
    #main-content { height: 100vh; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
    .dark ::-webkit-scrollbar-track { background: #2d3748; }
    .dark ::-webkit-scrollbar-thumb { background: #718096; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased">

<div id="critical-error" class="hidden fixed inset-0 bg-red-100 text-red-900 flex items-center justify-center z-50 text-center p-4">
    <div>
        <p class="text-2xl font-bold">Критическая ошибка</p>
        <p class="mt-2" id="critical-error-message"></p>
    </div>
</div>

<div id="access-denied" class="hidden fixed inset-0 bg-gray-100 dark:bg-gray-900 flex items-center justify-center z-50 text-center p-4">
    <div>
        <p class="text-2xl font-bold text-red-600 dark:text-red-500">Доступ запрещен</p>
        <p class="mt-2 text-gray-600 dark:text-gray-400">Чтобы получить доступ, пожалуйста, отправьте запрос через Telegram-бота.</p>
        <a id="requestAccessButton" href="#" target="_blank" class="mt-4 inline-block bg-sky-600 text-white font-bold py-2 px-4 rounded hover:bg-sky-700 transition">Отправить запрос</a>
    </div>
</div>

<div id="main-content" class="mx-auto max-w-7xl flex flex-col h-screen">
  <header class="p-4 bg-gray-100 dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700">
    <h1 class="text-xl sm:text-2xl font-bold text-sky-700 dark:text-sky-300 text-center">
      Lithuanian Verbs Search
    </h1>
    <div class="mt-4 relative">
      <input type="text" id="searchInput" placeholder="Загрузка базы..." disabled class="w-full p-3 pl-10 text-base border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 transition-all" />
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>

      <!-- ДОБАВЛЕННАЯ КНОПКА "X" -->
  <button id="clearSearchButton" class="hidden absolute right-3 top-1/2 transform -translate-y-1/2 p-1 cursor-pointer text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

    </div>

  </header>
  <div class="p-4 flex-grow flex flex-col overflow-hidden">
    <div id="table-wrapper" class="overflow-y-auto flex-grow bg-white dark:bg-gray-800 rounded-lg shadow-md">
        <table class="min-w-full text-sm">
            <thead id="table-head" class="bg-gray-50 dark:bg-gray-700 sticky top-0 z-10"></thead>
            <tbody id="table-body"></tbody>
        </table>
        <div id="no-results-message" class="hidden text-center p-8 text-gray-500">Ничего не найдено</div>
    </div>
    <p id="record-count" class="mt-4 text-xs text-gray-500 dark:text-gray-400 text-center flex-shrink-0"></p>
  </div>
</div>

<div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div id="modal-content" class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center p-4 border-b border-gray-200 dark:border-gray-700">
            <h2 id="modal-title" class="text-xl font-semibold text-gray-800 dark:text-gray-200"></h2>
            <button id="modal-close-button" class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 text-3xl leading-none">&times;</button>
        </div>
        <div id="modal-body" class="p-4 overflow-y-auto"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // === КОНФИГУРАЦИЯ (ИСПРАВЛЕНО) ===
    const CHECK_ACCESS_URL = "https://verbs-api-seven.vercel.app/api/check-access";
    const REQUEST_ACCESS_URL = "https://verbs-api-seven.vercel.app/api/request-access";

    // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
    let db;
    let totalVerbsCount = 0;
    const PAGE_SIZE = 100;
    let currentOffset = 0;
    let isLoading = false;
    let currentSearchTerm = "";
    const TENSE_TRANSLATIONS = { "Present tense": "Настоящее время", "Past tense": "Прошедшее время", "Future tense": "Будущее время", "Conditional mood": "Сослагательное наклонение", "Imperative mood": "Повелительное наклонение", "Past freq. tense": "Прошедшее многократное время" };
    
    // === DOM-ЭЛЕМЕНТЫ ===
    const searchInput = document.getElementById('searchInput');
    const clearSearchButton = document.getElementById('clearSearchButton');
    const tableHead = document.getElementById('table-head');
    const tableBody = document.getElementById('table-body');
    const noResultsMessage = document.getElementById('no-results-message');
    const recordCount = document.getElementById('record-count');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const modalCloseButton = document.getElementById('modal-close-button');
    const tableWrapper = document.getElementById('table-wrapper');

    // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===
    const normalizeForSearch = (s) => s ? s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') : "";
    const createSearchRegex = (term) => {
    // Заменяем каждую букву 'i' или 'y' на шаблон [iy], который означает "любой из этих символов"
    return term.replace(/[iy]/g, '[iy]');
};
    const getPreferredForm = (formsArray) => {
    if (!formsArray || formsArray.length === 0) return '-';

    // Проверяем наличие только знаков ударения (акут, гравис, тильда),
        // игнорируя другие диакритики литовского алфавита (как в ą, č, ę, ė, į, š, ų, ū, ž).
        const hasStress = (s) => /[\u0300\u0301\u0303]/.test(s.normalize('NFD'));
        
        const stressedForms = formsArray.filter(hasStress);

        // Если найдены формы с ударением, показываем только их.
        // В противном случае, показываем исходные формы (без ударения).
        const formsToShow = stressedForms.length > 0 ? stressedForms : formsArray;
        
        return formsToShow.join(' / ');
    };

    // === ФУНКЦИИ РЕНДЕРИНГА (без изменений) ===
    function renderTable(verbs, append = false) {
        if (!append) { const headers = ['№', 'P', '#', 'Инфинитив', '3 л. настоящего вр.', '3 л. прошедшего однократного вр.', 'Вопрос', 'Перевод']; let headerHTML = '<tr>'; headers.forEach(h => { let classes = 'py-3 px-4 text-left text-xs font-semibold text-sky-700 dark:text-sky-300 uppercase'; if (['№', 'P', '#'].includes(h)) classes += ' w-[50px] text-center px-1'; headerHTML += `<th class="${classes}">${h}</th>`; }); headerHTML += '</tr>'; tableHead.innerHTML = headerHTML; tableBody.innerHTML = ''; }
        verbs.forEach(verb => {
             const tr = document.createElement('tr');
             tr.className = 'hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-150 even:bg-gray-100 dark:even:bg-gray-700';
             if (verb.is_priority === 1) {
        // Убираем старую "серую" зебру, чтобы она не мешала
    tr.classList.remove('even:bg-gray-100', 'dark:even:bg-gray-700');

    // Добавляем рамку и создаем нашу собственную "фиолетовую зебру"
    tr.classList.add(
        'border-l-4',
        'border-violet-500',
        'bg-violet-100',                               // Фон для нечетных строк (светлая тема)
        'dark:bg-violet-900/40',                       // Фон для нечетных строк (темная тема)
        'even:bg-violet-200/80',                       // Фон для ЧЕТНЫХ строк (светлая тема)
        'dark:even:bg-violet-800/40'                   // Фон для ЧЕТНЫХ строк (темная тема)
    );
             }
        // Для подсветки фона можно использовать: tr.classList.add('bg-violet-100', 'dark:bg-violet-900/50');
             if (verb.conjugations) { tr.classList.add('cursor-pointer'); tr.addEventListener('click', () => showModalForVerb(verb));
             
             } const db_keys = ['id_num', 'p_val', 'hash_val', 'infinitive', 'present_3rd', 'past_3rd', 'question', 'translation']; let rowHTML = '';
             db_keys.forEach(key => { let classes = 'py-2 px-4 text-left text-gray-700 dark:text-gray-300';
             if (['id_num', 'p_val', 'hash_val'].includes(key)) classes += ' text-center px-1 text-gray-600 dark:text-gray-400';
             else if (key === 'infinitive') classes += ' text-gray-800 dark:text-gray-200';
             if (key === 'translation') {
        classes += ' whitespace-normal break-words';
    }
             let cellContent = verb[key] || '';
// Если в ячейке строка с запятой, берем только первую часть
if (typeof cellContent === 'string' && cellContent.includes(',')) {
    cellContent = cellContent.split(',')[0].trim() + '...'; // Показываем первый вариант и многоточие
}
rowHTML += `<td class="${classes}">${cellContent}</td>`;
             }); tr.innerHTML = rowHTML; tableBody.appendChild(tr); });
        noResultsMessage.classList.toggle('hidden', tableBody.children.length > 0); recordCount.textContent = `Showing ${tableBody.children.length} of ${totalVerbsCount} verbs`;
    }
    function showModalForVerb(verb) {
        if (!verb.conjugations) return; const verbInfo = JSON.parse(verb.conjugations); modalTitle.textContent = `${verb.infinitive.charAt(0).toUpperCase() + verb.infinitive.slice(1)} - ${verb.translation}`; modalBody.innerHTML = ''; const tenses = { "Present tense": verbInfo["Present tense"], "Past tense": verbInfo["Past tense"], "Future tense": verbInfo["Future tense"], "Conditional mood": verbInfo["Conditional mood"], "Imperative mood": verbInfo["Imperative mood"], "Past freq. tense": verbInfo["Past freq. tense"] }; const mainTenses = ["Present tense", "Past tense", "Future tense", "Conditional mood"]; const persons = ["Aš", "Tu", "Jis/ji", "Mes", "Jūs", "Jie/jos"]; let tableHTML = `<div class="overflow-x-auto"><table class="min-w-full text-sm divide-y divide-gray-200 dark:divide-gray-700 mb-4">`; tableHTML += `<thead class="bg-gray-50 dark:bg-gray-700"><tr><th class="px-2 py-1"></th>`; mainTenses.forEach(tense => { tableHTML += `<th class="px-2 py-1 text-left text-xs font-semibold text-sky-700 dark:text-sky-300">${TENSE_TRANSLATIONS[tense] || tense}</th>`; }); tableHTML += `</tr></thead><tbody class="divide-y divide-gray-200 dark:divide-gray-700">`; persons.forEach((person, personIndex) => { tableHTML += `<tr class="hover:bg-gray-100 dark:hover:bg-gray-600 even:bg-gray-50 dark:even:bg-gray-800/50"><td class="px-2 py-1 font-semibold">${person}</td>`; mainTenses.forEach(tense => { const item = tenses[tense] ? tenses[tense][personIndex] : null; const form = item ? getPreferredForm(item.forms) : '-'; tableHTML += `<td class="px-2 py-1">${form}</td>`; }); tableHTML += `</tr>`; }); tableHTML += `</tbody></table></div>`; modalBody.innerHTML = tableHTML;
        ["Imperative mood", "Past freq. tense"].forEach(tense => { if (tenses[tense] && tenses[tense].length > 0) { let tenseHTML = `<h3 class="text-lg font-semibold mt-4 mb-2 text-sky-600 dark:text-sky-400">${TENSE_TRANSLATIONS[tense] || tense}</h3>`; tenseHTML += `<table class="min-w-full text-sm"><tbody class="divide-y divide-gray-200 dark:divide-gray-700">`; tenses[tense].forEach(row => { tenseHTML += `<tr class="hover:bg-gray-100 dark:hover:bg-gray-600 even:bg-gray-50 dark:even:bg-gray-800/50"><td class="px-2 py-1 w-1/4 font-semibold">${row.person}</td><td class="px-2 py-1">${getPreferredForm(row.forms)}</td></tr>`; }); tenseHTML += `</tbody></table>`; modalBody.innerHTML += tenseHTML; } });
        modalOverlay.classList.remove('hidden');
    }
    function closeModal() { modalOverlay.classList.add('hidden'); }

    // --- БЛОК ЛОГИКИ ДОСТУПА (ПОЛНОСТЬЮ ПЕРЕПИСАН) ---
    function showCriticalError(message) {
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('access-denied').classList.add('hidden');
        document.getElementById('critical-error-message').textContent = message;
        document.getElementById('critical-error').classList.remove('hidden');
    }

    async function handleRequestAccessClick(event) {
        event.preventDefault(); // Предотвращаем любые действия по умолчанию
        const requestButton = document.getElementById('requestAccessButton');
        const originalText = requestButton.textContent;
        requestButton.disabled = true;
        requestButton.textContent = 'Отправка...';

        try {
            const tg = Telegram.WebApp;
            if (!tg.initData) {
                alert('Не удалось получить данные Telegram. Пожалуйста, перезапустите приложение.');
                throw new Error('initData is missing');
            }

            const response = await fetch(REQUEST_ACCESS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({ message: 'Не удалось прочитать ответ сервера.' }));
                throw new Error(`Сервер ответил ошибкой: ${response.status}. ${errorData.message || ''}`);
            }

            const result = await response.json();
            if (result.success) {
                alert('Ваш запрос успешно отправлен администратору! Вы получите уведомление в Telegram о решении.');
                requestButton.textContent = 'Отправлено!';
                // Кнопка остается неактивной, доступ НЕ предоставляется
            } else {
                throw new Error(result.message || 'Произошла неизвестная ошибка при отправке запроса.');
            }

        } catch (error) {
            console.error('Failed to send access request:', error);
            alert(`Ошибка: ${error.message}`);
            requestButton.disabled = false; // Позволяем попробовать еще раз
            requestButton.textContent = originalText;
        }
    }
    
    function showAccessDeniedScreen() {
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('access-denied').classList.remove('hidden');
        
        const requestButton = document.getElementById('requestAccessButton');
        requestButton.href = '#';
        requestButton.removeEventListener('click', handleRequestAccessClick);
        requestButton.addEventListener('click', handleRequestAccessClick);
    }

    function showAppContent() {
        document.getElementById('main-content').style.display = 'flex';
        document.getElementById('access-denied').classList.add('hidden');
        document.getElementById('critical-error').classList.add('hidden');
    }

    async function checkTelegramAccess(initData) {
        const response = await fetch(CHECK_ACCESS_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: initData })
        });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Server responded with status: ${response.status}, body: ${errorText}`);
        }
        const data = await response.json();
        return data.isAllowed;
    }

    // --- ЗАГРУЗКА БАЗЫ ДАННЫХ (без изменений) ---
    async function loadMoreVerbs(isNewSearch = false) {
        if (!db || isLoading) return; isLoading = true; if (isNewSearch) currentOffset = 0;
        let stmt; const normalizedTerm = normalizeForSearch(currentSearchTerm); const trimmedTerm = currentSearchTerm.trim();
        if (trimmedTerm && !isNaN(trimmedTerm)) { stmt = db.prepare(`SELECT * FROM verbs WHERE id_num = :term OR p_val = :term OR hash_val = :term LIMIT :limit OFFSET :offset`); stmt.bind({ ':term': Number(trimmedTerm), ':limit': PAGE_SIZE, ':offset': currentOffset }); 
            } else if (normalizedTerm) {
            const searchRegex = createSearchRegex(normalizedTerm);    
            const sql = `
        SELECT 
            *,
            CASE
                WHEN infinitive_norm LIKE :term_start THEN 1
                WHEN translation_norm LIKE :term_start THEN 1
                WHEN present_3rd_norm LIKE :term_start THEN 1
                WHEN past_3rd_norm LIKE :term_start THEN 1
                WHEN question_norm LIKE :term_start THEN 1
                ELSE 0
            END AS is_priority
        FROM verbs 
        WHERE 
            -- Используем новый оператор REGEXP для основного поиска
            infinitive_norm REGEXP :regex OR 
            translation_norm REGEXP :regex OR 
            present_3rd_norm REGEXP :regex OR 
            past_3rd_norm REGEXP :regex OR 
            question_norm REGEXP :regex
        ORDER BY is_priority DESC, id_num
        LIMIT :limit OFFSET :offset`;
    stmt = db.prepare(sql);
    stmt.bind({
        ':regex':      searchRegex,              // Наш новый шаблон RegEx
        ':term_start': `${normalizedTerm}%`,      // Для поиска в начале слова
        ':limit':      PAGE_SIZE,
        ':offset':     currentOffset
    });
            } else { stmt = db.prepare("SELECT * FROM verbs ORDER BY id_num LIMIT :limit OFFSET :offset");
            
            stmt.bind({ ':limit': PAGE_SIZE, ':offset': currentOffset }); }
        const results = []; while(stmt.step()) { results.push(stmt.getAsObject()); } stmt.free(); renderTable(results, !isNewSearch); currentOffset += results.length; isLoading = false;
    }
    async function main() {
        try {
            const SQL = await initSqlJs({ locateFile: file => `https://sql.js.org/dist/${file}` });
            const response = await fetch("./verbs.sqlite");
            if (!response.ok) { throw new Error(`Database fetch failed: ${response.status} ${response.statusText}`); }
            const dbFile = await response.arrayBuffer();
            db = new SQL.Database(new Uint8Array(dbFile));
            // Регистрируем функцию REGEXP, чтобы ее можно было использовать в SQL-запросах
        db.create_function("REGEXP", (pattern, text) => new RegExp(pattern, "i").test(text));
            const countResult = db.exec("SELECT COUNT(*) FROM verbs"); totalVerbsCount = countResult[0].values[0][0];
            searchInput.disabled = false; searchInput.placeholder = "Search any form..."; await loadMoreVerbs(true);
            let debounceTimer; searchInput.addEventListener('input', (e) => { 
                            // Показываем или скрываем кнопку "X" в зависимости от наличия текста
                if (e.target.value.length > 0) {
                    clearSearchButton.classList.remove('hidden');
                } else {
                    clearSearchButton.classList.add('hidden');
                }
                clearTimeout(debounceTimer); debounceTimer = setTimeout(() => { currentSearchTerm = e.target.value; loadMoreVerbs(true); }, 300); 
            });
                // Обработчик для кнопки "X": очищает поле и сбрасывает поиск
clearSearchButton.addEventListener('click', () => {
    searchInput.value = ''; // Очищаем значение поля
    currentSearchTerm = ''; // Очищаем терм для поиска
    clearSearchButton.classList.add('hidden'); // Сразу скрываем кнопку
    loadMoreVerbs(true); // Загружаем полный список
    searchInput.focus(); // Возвращаем фокус в поле ввода для удобства
});
            tableWrapper.addEventListener('scroll', () => { if (!isLoading && tableWrapper.scrollTop + tableWrapper.clientHeight >= tableWrapper.scrollHeight - 200) { loadMoreVerbs(false); } });
            modalCloseButton.addEventListener('click', closeModal); modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); }); document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) closeModal(); });
        } catch (err) { console.error("Initialization error (main function):", err); showCriticalError(`Failed to load database. Error: ${err.message}`); }
    }
    
    // --- ГЛАВНАЯ ФУНКЦИЯ ИНИЦИАЛИЗАЦИИ ---
    async function initializeApp() {
        try {
            if (typeof Telegram === 'undefined' || typeof Telegram.WebApp === 'undefined') {
                showAccessDeniedScreen(); // Вне Telegram доступ всегда запрещен
                alert("Это приложение предназначено для запуска внутри Telegram.");
                return;
            }

            const tg = Telegram.WebApp;
            tg.ready();
            const applyTheme = () => document.body.classList.toggle('dark', tg.colorScheme === 'dark');
            tg.onEvent('themeChanged', applyTheme);
            applyTheme();
            tg.MainButton.setParams({ text: 'Закрыть', color: '#0ea5e9', text_color: '#ffffff', is_visible: true });
            tg.onEvent('mainButtonClicked', () => tg.close());
            
            if (tg.initData) {
                const isAllowed = await checkTelegramAccess(tg.initData);
                if (isAllowed) { 
                    showAppContent();
                    await main();
                } else { 
                    showAccessDeniedScreen(); 
                }
            } else {
                showAccessDeniedScreen(); // Если нет initData, доступ запрещен
            }
        } catch (e) {
            console.error("CRITICAL ERROR during initialization:", e);
            showCriticalError(e.message);
        }
    }
    
    initializeApp();
});
</script>
</body>
</html>
