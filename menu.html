<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Меню | Lithuanian Verbs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center h-screen">
    <div class="text-center p-4">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-6">Выберите таблицу</h1>
        
        <div class="space-y-4">
            <!-- Кнопка 1: 444 глагола -->
            <a href="https://yurinick.github.io/444-Lithuanian-verbs/" class="block w-full max-w-sm mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
                <div class="text-xl font-semibold text-sky-600 dark:text-sky-400">📚 444 глагола</div>
                <p class="text-gray-600 dark:text-gray-400 mt-1">3 основные формы</p>
            </a>
            
            <!-- Кнопка 2: 4000+ глаголов -->
            <a href="https://yurinick.github.io/lithuanian-verbs-app/" class="block w-full max-w-sm mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
                <div class="text-xl font-semibold text-violet-600 dark:text-violet-400">📖 4000+ глаголов</div>
		  <p class="text-gray-600 dark:text-gray-400 mt-1">Все формы и спряжения</p>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = Telegram.WebApp;
            tg.ready();
            
            // Адаптация под тему Telegram
            const applyTheme = () => {
                document.body.classList.toggle('dark', tg.colorScheme === 'dark');
            };
            tg.onEvent('themeChanged', applyTheme);
            applyTheme();
        });
    </script>
</body>
</html>
